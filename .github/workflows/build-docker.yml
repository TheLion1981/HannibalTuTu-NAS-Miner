name: Build NAS miner image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    # Dagelijks opnieuw bouwen zodat 'latest' de actuele MoneroOcean fork kan volgen.
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hannibaltutu-nas-miner
          tags: |
            type=raw,value=latest
            type=raw,value=1.0.0,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            XMRIG_REF=master
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
