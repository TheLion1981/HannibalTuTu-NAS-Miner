services:
  hannibaltutu-miner:
    image: ghcr.io/thelion1981/hannibaltutu-nas-miner:latest
    container_name: hannibaltutu-miner
    restart: unless-stopped
    pull_policy: always
    environment:
      # 1) YOUR OWN MONERO WALLET
      WALLET: "YOUR_MONERO_WALLET_HERE"

      # 2) A recognisable name for this NAS/miner
      WORKER: "My-NAS"

      # 3) CPU threads. DS224+ users can start with 3.
      THREADS: "3"

      # Beginner defaults: normally leave these unchanged
      POOL: "gulf.moneroocean.stream:10128"
      PRINT_TIME: "60"
